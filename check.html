<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>形の確認</title>
<style>
  :root {
    --paper: #f7f8f6; --ink: #1d2a24; --muted: #5d6b64; --shape: #2f5d4a; --line: #d5dbd7;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #141a17; --ink: #e6ece8; --muted: #9aa8a1; --shape: #7fb89d; --line: #2c3631; color-scheme: dark; }
  }
  body { margin: 0; padding: 24px; background: var(--paper); color: var(--ink);
         font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: baseline; margin-bottom: 20px; }
  h1 { font-size: 1.25rem; margin: 0; }
  #status { color: var(--muted); font-size: .9rem; }
  button { font: inherit; padding: 6px 14px; border: 1px solid var(--line); border-radius: 6px;
           background: transparent; color: var(--ink); cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--shape); outline-offset: 2px; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; }
  figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
  svg { width: 100%; aspect-ratio: 1; display: block; }
  path { fill: var(--shape); }
  figcaption { font-size: .85rem; margin-top: 6px; }
  figcaption small { color: var(--muted); display: block; }
  footer { margin-top: 28px; font-size: .8rem; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>形の確認</h1>
  <span id="status">読み込み中…</span>
  <button id="reroll" type="button" disabled>別の20件を表示</button>
</header>
<main id="grid"></main>
<footer>出典：国土数値情報（行政区域データ）（国土交通省）を加工して作成（加工元：smartnews-smri/japan-topography）</footer>

<script type="module">
  import { geoMercator, geoPath } from "https://cdn.jsdelivr.net/npm/d3-geo@3.1.1/+esm";
  import { feature } from "https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/+esm";

  const SIZE = 200, PAD = 12;
  const status = document.getElementById("status");
  const grid = document.getElementById("grid");
  const reroll = document.getElementById("reroll");

  const [topo, index] = await Promise.all([
    fetch("data/municipalities.topojson").then((r) => r.json()),
    fetch("data/index.json").then((r) => r.json()),
  ]);
  const shapes = new Map(
    feature(topo, topo.objects.municipalities).features.map((f) => [f.id, f])
  );
  status.textContent = `${index.length}件を読み込みました`;

  function draw() {
    const picks = [...index].sort(() => Math.random() - 0.5).slice(0, 20);
    grid.replaceChildren(...picks.map((m) => {
      const f = shapes.get(m.code);
      const projection = geoMercator().fitExtent([[PAD, PAD], [SIZE - PAD, SIZE - PAD]], f);
      const fig = document.createElement("figure");
      fig.innerHTML =
        `<svg viewBox="0 0 ${SIZE} ${SIZE}" role="img" aria-label="${m.pref}${m.name}の形">` +
        `<path d="${geoPath(projection)(f)}"/></svg>` +
        `<figcaption>${m.pref} ${m.name}<small>${m.code}</small></figcaption>`;
      return fig;
    }));
  }
  reroll.addEventListener("click", draw);
  reroll.disabled = false;
  draw();
</script>
</body>
</html>
